<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitobxon.uz — O'zbek kitobxonlar platformasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <meta name="description" content="O'zbek kitobxonlar platformasi — kitoblarni kuzatib boring, taqrizlar yozing">
</head>
<body>
  <!-- Loading screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="loading-logo"> <img src="—Pngtree—book icon vector image_8926794.png" style="height: 15rem;"></div>
      <div class="loading-text">Kitobxon.uz</div>
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modals container -->
  <div id="modal-container"></div>

  <!-- Navigation -->
  <nav id="navbar" class="navbar">
    <div class="nav-inner">
      <a href="#/" class="nav-logo" onclick="navigate('/')">
        <span class="logo-icon">📚</span>
        <span class="logo-text">Kitobxon<span class="logo-accent">.uz</span></span>
      </a>

      <div class="nav-links" id="nav-links">
        <a href="#/kitoblar" class="nav-link" onclick="navigate('/kitoblar')">Kitoblar</a>
        <a href="#/top" class="nav-link" onclick="navigate('/top')">Top Kitoblar</a>
      </div>

      <div class="nav-right">
        <button class="btn-search-icon" onclick="toggleSearch()" title="Qidirish">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>

        <div id="nav-user-section">
          <!-- Filled by JS -->
        </div>
      </div>
    </div>

    <!-- Search bar -->
    <div class="nav-search" id="nav-search" style="display:none">
      <div class="search-inner">
        <input type="text" id="search-input" placeholder="Kitob yoki muallif nomini kiriting..." autocomplete="off">
        <button onclick="performSearch()">Qidirish</button>
      </div>
    </div>
  </nav>

  <!-- Main content area -->
  <main id="app" class="app-main"></main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">Kitobxon<span class="logo-accent">.uz</span></span>
      </div>
      <p class="footer-desc">O'zbek kitobxonlar hamjamiyati. Kitoblarni kuzatib boring, taqrizlar yozing, kitobsevarlar bilan bog'laning.</p>
      <div class="footer-links">
        <a onclick="navigate('/')">Bosh sahifa</a>
        <a onclick="navigate('/kitoblar')">Kitoblar</a>
        <a onclick="navigate('/top')">Top Kitoblar</a>
      </div>
      <p class="footer-copy">© 2026 Kitobxon.uz — Barcha huquqlar himoyalangan</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
